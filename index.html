<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zaki & Puteri Wedding Invitation</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* --- ROYAL MAROON & GOLD THEME --- */
        :root {
            --bg-color: #FDFBF7;
            --text-main: #5A1E22;
            --text-sub: #7A5B42;
            --accent-gold: #D4AF37;
            --card-bg: #FFFFFF;
            --shadow: 0 25px 60px rgba(90, 30, 34, 0.15);
        }

        /* Default: DARK MODE */
        body {
            --bg-color: #1A0F10;
            --text-main: #FDFBF7;
            --text-sub: #D4AF37;
            --card-bg: #2A1618;
            --shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        body.light-mode {
            --bg-color: #FDFBF7;
            --text-main: #5A1E22;
            --text-sub: #7A5B42;
            --card-bg: #FFFFFF;
            --shadow: 0 25px 60px rgba(90, 30, 34, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 10px;
            scroll-behavior: smooth;
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); z-index: 9999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px;
            transition: opacity 1s ease, visibility 1s ease;
        }
        #splash h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 6vw, 2.2rem);
            letter-spacing: 3px; color: var(--text-main);
            margin-bottom: 10px; text-align: center; text-transform: uppercase;
        }
        #splash p {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.8rem, 7vw, 2.4rem);
            color: var(--accent-gold); margin-bottom: 30px;
        }
        .btn-open {
            padding: clamp(12px, 3vw, 16px) clamp(30px, 8vw, 45px);
            border: 2px solid var(--accent-gold);
            background: transparent; color: var(--text-main);
            font-family: 'Playfair Display', serif; font-weight: 600;
            font-size: clamp(0.85rem, 3.2vw, 1rem);
            letter-spacing: 2px; cursor: pointer; border-radius: 30px;
            transition: all 0.3s; animation: pulse 2s infinite; text-transform: uppercase;
        }
        .btn-open:hover { background: var(--accent-gold); color: #fff; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55,0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55,0); }
        }

        /* --- MAIN CONTENT --- */
        #main-content {
            opacity: 0; visibility: hidden;
            transition: opacity 1.5s ease;
            width: 100%; max-width: 480px;
            padding: 10px 15px;
            display: flex; flex-direction: column; align-items: center; z-index: 10;
        }

        /* --- CONTROLS --- */
        .top-controls {
            position: fixed; top: 15px; right: 15px;
            display: flex; gap: 10px; z-index: 100;
        }
        .control-btn {
            background: var(--card-bg); border: 1px solid var(--accent-gold);
            color: var(--text-main);
            width: clamp(36px, 10vw, 44px);
            height: clamp(36px, 10vw, 44px);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-size: clamp(0.95rem, 4vw, 1.15rem); transition: all 0.3s;
        }
        .control-btn:hover { transform: scale(1.1); }

        /* --- 3D CARD SCENE (RESPONSIVE) --- */
        .scene {
            width: 82vw;
            max-width: 320px;
            aspect-ratio: 2 / 3; /* kekalkan nisbah kad */
            perspective: 900px;
            margin-top: 60px;
            margin-bottom: 30px;
            z-index: 10;
            position: relative;
            overflow: hidden; /* elak kad terkeluar semasa putar */
            padding: 4px;
        }

        .card-container {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            cursor: pointer;
            animation: autoRotate 12s linear infinite;
            transition: transform 0.4s ease-out;
            will-change: transform;
        }

        @keyframes autoRotate {
            0%   { transform: rotateY(0deg) rotateX(4deg); }
            50%  { transform: rotateY(180deg) rotateX(4deg); }
            100% { transform: rotateY(360deg) rotateX(4deg); }
        }

        .card-face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: var(--shadow);
            background-size: cover; background-position: center; background-repeat: no-repeat;
            border: clamp(4px, 1.5vw, 6px) solid var(--card-bg);
            outline: 2px solid var(--accent-gold);
            outline-offset: -12px;
            background-color: #333;
        }

        .card-face::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,215,0,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); transition: 0.5s; pointer-events: none;
        }
        .card-container:hover .card-face::before { left: 125%; }

        .card-front { background-image: url('depan.jpg'); transform: rotateY(0deg); }
        .card-back  { background-image: url('belakang.jpg'); transform: rotateY(180deg); }

        /* Hanya aktifkan tilt jika peranti sokong hover (laptop/desktop) */
        @media (hover: hover) and (pointer: fine) {
            .card-container:hover { animation-play-state: paused; }
        }

        /* --- TEXT & BUTTONS --- */
        .info-section {
            text-align: center; width: 100%;
            max-width: 360px;
            margin-bottom: 50px; padding-top: 20px;
        }
        .names {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.3rem, 5.5vw, 1.9rem);
            font-weight: 600; color: var(--text-main);
            margin-bottom: 5px; line-height: 1.2;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .names span {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2rem, 8vw, 2.6rem);
            color: var(--accent-gold); text-transform: lowercase;
            display: block; margin: 5px 0;
        }

        .date-container {
            display: flex; flex-direction: column; align-items: center; margin-bottom: 25px;
        }
        .day-text {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.6rem, 6.5vw, 2.1rem);
            color: var(--accent-gold); margin-bottom: -5px;
        }
        .date-text {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.8rem, 3.4vw, 0.98rem);
            font-weight: 600;
            letter-spacing: clamp(1.5px, 0.8vw, 3px);
            text-transform: uppercase; color: var(--text-main);
        }
        .time-text {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.75rem, 3vw, 0.88rem);
            font-weight: 500;
            letter-spacing: 2px; color: var(--text-sub); margin-top: 5px;
        }

        /* --- COUNTDOWN --- */
        .countdown-container {
            display: flex; justify-content: center;
            gap: clamp(5px, 2vw, 10px);
            margin-bottom: 30px;
        }
        .countdown-box {
            background: var(--card-bg);
            padding: clamp(8px, 2.5vw, 12px) clamp(8px, 2.5vw, 14px);
            border-radius: 8px;
            border: 1px solid var(--accent-gold);
            min-width: clamp(52px, 15vw, 68px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex: 1;
        }
        .countdown-box span {
            display: block; font-family: 'Playfair Display', serif;
            font-size: clamp(1.1rem, 4.5vw, 1.45rem);
            font-weight: 600; color: var(--text-main);
        }
        .countdown-box small {
            font-size: clamp(0.55rem, 2.2vw, 0.65rem);
            text-transform: uppercase;
            letter-spacing: 1px; color: var(--accent-gold); font-weight: 600;
        }

        /* --- ACTION BUTTONS --- */
        .action-buttons {
            display: flex; flex-direction: column;
            gap: 12px; width: 100%;
        }
        .btn-action {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: clamp(13px, 3.5vw, 16px);
            border-radius: 30px; text-decoration: none;
            font-family: 'Montserrat', sans-serif; font-weight: 600;
            font-size: clamp(0.78rem, 3vw, 0.88rem);
            letter-spacing: 1px; transition: all 0.3s; border: none; cursor: pointer;
            text-transform: uppercase;
            width: 100%;
        }
        .btn-rsvp {
            background: linear-gradient(135deg, #D4AF37, #B8860B); color: #fff;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }
        .btn-rsvp:hover { box-shadow: 0 15px 25px rgba(212, 175, 55, 0.5); }
        .btn-maps, .btn-calendar {
            background-color: transparent; border: 1px solid var(--accent-gold);
            color: var(--text-main);
        }
        .btn-maps:hover, .btn-calendar:hover { background-color: rgba(212, 175, 55, 0.1); }
        .btn-action:hover { transform: translateY(-3px); }

        /* --- PARTICLES / CONFETTI --- */
        #particles-js {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }
        #confetti-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9998; pointer-events: none;
        }

        /* --- MOBILE TWEAK KHAS --- */
        @media (max-width: 400px) {
            #main-content { padding: 10px 12px; }
            .scene { width: 78vw; max-width: 280px; margin-top: 55px; }
            .info-section { padding-top: 12px; }
        }

        /* --- LANDSCAPE PHONE --- */
        @media (max-height: 480px) and (orientation: landscape) {
            .scene { width: 40vw; margin-top: 40px; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <div id="splash">
        <h1>Zaki & Puteri</h1>
        <p>The Wedding</p>
        <button class="btn-open" onclick="openInvitation()">Tap to Open 💌</button>
    </div>

    <canvas id="confetti-canvas"></canvas>
    <div id="particles-js"></div>

    <div id="main-content">
        <div class="top-controls">
            <button class="control-btn" id="audioBtn" onclick="toggleAudio()" title="Play Music">🎵</button>
            <button class="control-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle Theme">☀️</button>
        </div>

        <div class="scene" id="scene">
            <div class="card-container" id="card">
                <div class="card-face card-front"></div>
                <div class="card-face card-back"></div>
            </div>
        </div>

        <div class="info-section" id="details">
            <div class="names">
                Muhd Zaki
                <span>&</span>
                Puteri Nurlydia
            </div>

            <div class="date-container">
                <div class="day-text">Sunday</div>
                <div class="date-text">27 December 2026</div>
                <div class="time-text">11:00 AM - 5:00 PM</div>
            </div>

            <div class="countdown-container" id="countdown">
                <div class="countdown-box"><span id="days">00</span><small>Days</small></div>
                <div class="countdown-box"><span id="hours">00</span><small>Hours</small></div>
                <div class="countdown-box"><span id="mins">00</span><small>Mins</small></div>
                <div class="countdown-box"><span id="secs">00</span><small>Secs</small></div>
            </div>

            <div class="action-buttons">
                <a href="https://wa.me/6587844828?text=Assalamualaikum%20%2F%20Hello%20Rahim.%20Saya%20ingin%20mengesahkan%20kehadiran%20ke%20majlis%20Zaki%20%26%20Puteri.%20(I%20would%20like%20to%20RSVP%20for%20Zaki%20%26%20Puteri's%20wedding)." target="_blank" class="btn-action btn-rsvp">
                    💬 RSVP (WhatsApp)
                </a>
                <a href="https://maps.google.com/?q=706+Clementi+West+Street+2+Singapore+120706" target="_blank" class="btn-action btn-maps">
                    📍 View Location
                </a>
                <button onclick="downloadICS()" class="btn-action btn-calendar">
                    📅 Save the Date
                </button>
            </div>
        </div>
    </div>

    <script>
        let audioCtx, isAudioPlaying = false, loopInterval;
        let autoScrollActive = false, scrollSpeed = 0.8;

        function openInvitation() {
            fireConfetti();
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-content').style.opacity = '1';
                document.getElementById('main-content').style.visibility = 'visible';
                initParticles();
                playLoopAudio();
                setTimeout(startAutoScroll, 2500);
            }, 800);
        }

        function startAutoScroll() {
            autoScrollActive = true;
            let scrollPos = window.scrollY;
            function scrollStep() {
                if (!autoScrollActive) return;
                scrollPos += scrollSpeed;
                window.scrollTo(0, scrollPos);
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 10) {
                    autoScrollActive = false; return;
                }
                requestAnimationFrame(scrollStep);
            }
            requestAnimationFrame(scrollStep);
        }

        ['mousedown', 'wheel', 'touchstart'].forEach(evt => {
            window.addEventListener(evt, () => { autoScrollActive = false; }, { passive: true });
        });

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById('themeBtn');
            btn.innerHTML = document.body.classList.contains('light-mode') ? '🌙' : '☀️';
        }

        // --- 3D TILT (hanya peranti hover: desktop/laptop) ---
        const card = document.getElementById('card');
        const scene = document.getElementById('scene');

        if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                const xAxis = ((rect.left + rect.width / 2) - e.pageX) / 20;
                const yAxis = ((rect.top + rect.height / 2) - e.pageY) / 20;
                card.style.animationPlayState = 'paused';
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });

            scene.addEventListener('mouseleave', () => {
                card.style.transform = '';
                card.style.animationPlayState = 'running';
            });
        }

        // --- COUNTDOWN ---
        const targetDate = new Date("December 27, 2026 11:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;
            if (distance < 0) return;

            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById("mins").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById("secs").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }, 1000);

        // --- AUDIO ---
        function playLoopAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isAudioPlaying = true;
            document.getElementById('audioBtn').innerHTML = '🔊';

            const masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            masterGain.gain.setValueAtTime(0.25, audioCtx.currentTime);

            const notesC = [261.63, 329.63, 392.00, 523.25];
            const notesG = [196.00, 246.94, 293.66, 392.00];
            const notesAm = [220.00, 261.63, 329.63, 440.00];
            const notesF = [174.61, 220.00, 261.63, 349.23];

            let loopStep = 0;
            function playNextSequence() {
                if (!isAudioPlaying) return;
                let time = audioCtx.currentTime;
                let seq = [notesC, notesG, notesAm, notesF][loopStep % 4];
                seq.forEach(freq => { playTone(freq, time, 1.5, masterGain); time += 0.25; });
                seq.reverse().forEach(freq => { playTone(freq, time, 1.5, masterGain); time += 0.25; });
                loopStep++;
            }
            playNextSequence();
            loopInterval = setInterval(playNextSequence, 2000);
        }

        function playTone(freq, startTime, duration, masterGain) {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);
            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();
            lfo.frequency.value = 5;
            lfoGain.gain.value = 2;
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.5, startTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gainNode);
            gainNode.connect(masterGain);
            osc.start(startTime);
            osc.stop(startTime + duration);
            lfo.start(startTime);
            lfo.stop(startTime + duration);
        }

        function toggleAudio() {
            if (isAudioPlaying) {
                clearInterval(loopInterval); audioCtx.suspend();
                isAudioPlaying = false; document.getElementById('audioBtn').innerHTML = '🔇';
            } else {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume(); isAudioPlaying = true;
                    document.getElementById('audioBtn').innerHTML = '🔊';
                    playLoopAudio();
                } else { playLoopAudio(); }
            }
        }

        // --- ICS ---
        function downloadICS() {
            const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Zaki&Puteri Wedding//EN\nBEGIN:VEVENT\nUID:${new Date().getTime()}@wedding.com\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z\nDTSTART:20261227T030000Z\nDTEND:20261227T090000Z\nSUMMARY:Wedding of Muhd Zaki & Puteri Nurlydia\nLOCATION:706 Clementi West Street 2, Singapore 120706\nDESCRIPTION:With great pleasure, we invite you to celebrate our wedding.\nEND:VEVENT\nEND:VCALENDAR`;
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = 'Zaki_Puteri_Wedding.ics';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- PARTICLES ---
        function initParticles() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            document.getElementById('particles-js').appendChild(canvas);
            let width, height, particles = [];
            function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();

            class GoldDust {
                constructor() {
                    this.x = Math.random() * width; this.y = Math.random() * height - height;
                    this.size = Math.random() * 3 + 1; this.speedY = Math.random() * 0.8 + 0.3;
                    this.opacity = Math.random() * 0.8 + 0.2; this.twinkle = Math.random() * Math.PI;
                }
                update() {
                    this.y += this.speedY; this.x += Math.sin(this.y / 50) * 0.5; this.twinkle += 0.05;
                    if (this.y > height) { this.y = -10; this.x = Math.random() * width; }
                }
                draw() {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity * Math.abs(Math.sin(this.twinkle))})`;
                    ctx.fill();
                }
            }
            for (let i = 0; i < 70; i++) particles.push(new GoldDust());
            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
        }

        // --- CONFETTI ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let confetti = [];
            const colors = ['#D4AF37', '#F3E5AB', '#B8860B', '#FFFFFF'];
            for (let i = 0; i < 150; i++) {
                confetti.push({
                    x: canvas.width / 2, y: canvas.height / 2, w: Math.random() * 10 + 5, h: Math.random() * 5 + 2,
                    vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20 - 5,
                    rot: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 10,
                    color: colors[Math.floor(Math.random() * colors.length)], life: 1
                });
            }
            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                confetti.forEach(c => {
                    if (c.life <= 0) return;
                    active = true; c.x += c.vx; c.y += c.vy; c.vy += 0.5; c.vx *= 0.98;
                    c.rot += c.rotSpeed; c.life -= 0.01;
                    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot * Math.PI / 180);
                    ctx.fillStyle = c.color; ctx.globalAlpha = c.life;
                    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h); ctx.restore();
                });
                if (active) requestAnimationFrame(animateConfetti);
            }
            animateConfetti();
        }
    </script>
</body>
</html>
